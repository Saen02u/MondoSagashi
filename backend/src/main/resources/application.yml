server:
  port: 8080

spring:
  application:
    name: youtube-live-archive

  datasource:
    # 환경변수 DB_URL이 있으면 우선 사용하고, 없을 경우 DB_HOST/DB_PORT/DB_NAME으로 구성합니다.
    # 로컬 PostgreSQL이 미구동 시에도 인메모리 H2로 자동 전환 가능하도록 폴백을 제공합니다.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youtube_archive}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    # 개발 환경 스키마 관리: 엔티티 매핑에 따라 DDL을 자동 갱신(update)
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

logging:
  level:
    com.archive.youtube: DEBUG
    org.hibernate.SQL: DEBUG

youtube:
  api:
    # YouTube Data API v3 키는 서버 환경변수(YOUTUBE_API_KEY)로만 주입받습니다.
    key: ${YOUTUBE_API_KEY:}
    base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}
    # 할당량 보호: 1회 동기화 시 최대 페이징 한도 (기본 5페이지 = 250개 항목, 5 quota units)
    max-pages-per-sync: ${YOUTUBE_MAX_PAGES_PER_SYNC:5}
