services:
  # ----------------------------------------------------
  # 1. PostgreSQL 16 관계형 데이터베이스
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: youtube-archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-youtube_archive}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-youtube_archive}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - archive-net

  # ----------------------------------------------------
  # 2. Spring Boot 백엔드 애플리케이션
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youtube-archive-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-youtube_archive}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
    ports:
      - "8080:8080"
    networks:
      - archive-net

  # ----------------------------------------------------
  # 3. React SPA & Nginx 프론트엔드 (리버스 프록시 내장)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: youtube-archive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - archive-net

volumes:
  postgres_data:
    driver: local

networks:
  archive-net:
    driver: bridge
